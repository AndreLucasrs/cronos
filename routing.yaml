rules:
  # Checked first: a reminder request often also says "prazo" (the due date)
  # — e.g. "crie um lembrete ... com prazo 2026-10-05" — and must still win
  # over the estimativa rule below, since only this route has a tool-capable
  # provider wired up to actually create the reminder.
  - match: {keyword: [lembrete, lembrar, agenda]}
    provider: ollama-openai
    model: llama3.1:8b
  - match:
      keyword: [quanto tempo, estimativa, estimar, prazo, quantos dias, replanejar, replanejamento]
    provider: ollama
    model: deepseek-r1:14b
  - match: {keyword: [sidecar, via http, modo servidor]}
    provider: aegis4j-sidecar
    model: llama3.2:3b
  # Declarative RegexRoutingRule (not just keyword): a bug/error report shape
  # routes to a coding-oriented model instead of the plain default.
  - match: {regex: "(?i)\\b(exception|stack ?trace|erro:|bug)\\b"}
    provider: ollama
    model: qwen2.5-coder:7b
default:
  provider: ollama
  model: llama3.2:3b
